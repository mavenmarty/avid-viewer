name: Build APK

on:
  push:
    branches: [main, next, ci-check]
    # Documentation changes don't build or publish a new version.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/user-guide.yml"
      - ".github/scripts/update_user_guide.py"
      - ".github/scripts/build_guide_pdf.py"
      - ".github/scripts/guide-pdf.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore signing key
        id: key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD repository secrets not found. Building a test APK only; nothing will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "keystore=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Usability tests (remote navigation + crash hunting)
        run: gradle --no-daemon testDebugUnitTest

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-test-report-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Pictures of the main screens (sample data only) on the "screens" branch, to check how things look
      # without a device. Test builds only; adds a commit, never rewrites the branch.
      - name: Save screenshots
        if: always() && github.ref == 'refs/heads/next'
        run: |
          d=app/build/reports/tests/testDebugUnitTest/screens
          ls $d/*.png >/dev/null 2>&1 || exit 0
          tmp=$(mktemp -d); cp $d/*.png "$tmp"/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          wt=$(mktemp -d)
          if git fetch -q origin screens; then git worktree add -q "$wt" FETCH_HEAD; else git worktree add -q --detach "$wt"; (cd "$wt" && git checkout -q --orphan screens-new && git rm -rqf .); fi
          cd "$wt" && cp "$tmp"/*.png . && git add *.png && (git commit -qm "Screens from build ${{ github.run_number }} (${GITHUB_SHA::7})" || true) && git push -q origin HEAD:refs/heads/screens

      # Semantic version from the commits since the last release (see .github/scripts/next_version.sh).
      - name: Work out the version
        id: ver
        if: github.ref != 'refs/heads/ci-check'
        run: |
          git fetch -q --tags --unshallow origin 2>/dev/null || git fetch -q --tags origin
          .github/scripts/next_version.sh ${{ github.run_number }}

      - name: Build release APK
        if: github.ref != 'refs/heads/ci-check'
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.key.outputs.keystore }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: avidviewer
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        if: github.ref != 'refs/heads/ci-check'
        run: cp app/build/outputs/apk/release/app-release.apk AvidViewer.apk

      # R8 renames the app's classes; this file maps them back so an obfuscated crash report can be
      # read. It's unique to this build, so keep one per release. (No-op if minify is ever turned off.)
      - name: Save R8 mapping
        if: github.ref != 'refs/heads/ci-check'
        run: |
          m=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$m" ]; then cp "$m" "AvidViewer-${{ steps.ver.outputs.version }}-mapping.txt"; fi

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/ci-check'
        with:
          name: AvidViewer-${{ steps.ver.outputs.version }}
          path: AvidViewer.apk

      # The mapping is kept as its own build artifact, NOT a public release asset — the releases are
      # public, and a published mapping would undo the obfuscation. Only repo collaborators can download
      # it, from this run. To retrace an old release, open the "Build APK" run that built it.
      - name: Upload R8 mapping
        if: github.ref != 'refs/heads/ci-check'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.ver.outputs.version }}
          path: AvidViewer-${{ steps.ver.outputs.version }}-mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Publish release
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Avid Viewer ${{ steps.ver.outputs.version }}
          body: Install AvidViewer.apk on your TV box. New versions install over the old one and keep your settings.
          files: AvidViewer.apk
          make_latest: true

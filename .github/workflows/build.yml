name: Build APK

on:
  push:
    branches: [main, next, ci-check]
    # Documentation changes don't build or publish a new version.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/user-guide.yml"
      - ".github/scripts/update_user_guide.py"
      - ".github/scripts/build_guide_pdf.py"
      - ".github/scripts/guide-pdf.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A real Samba server for the network-share backup test (user test / test, share "backups").
    services:
      samba:
        image: dperson/samba
        ports:
          - 1445:445
        env:
          USER: "test;test"
          SHARE: "backups;/share;yes;no;no;test"
          PERMISSIONS: "true"
          USERID: "1000"
          GROUPID: "1000"
    steps:
      - uses: actions/checkout@v5

      - name: Restore signing key
        id: key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD repository secrets not found. Building a test APK only; nothing will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "keystore=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Usability tests (remote navigation + crash hunting)
        env:
          SMB_TEST_ADDRESS: "\\\\127.0.0.1:1445\\backups\\AvidViewer"
        run: gradle --no-daemon testDebugUnitTest

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-test-report-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Pictures of the main screens (sample data only) on the "screens" branch, to check how things look
      # without a device. Test builds only; adds a commit, never rewrites the branch.
      - name: Save screenshots
        if: always() && github.ref == 'refs/heads/next'
        run: |
          d=app/build/reports/tests/testDebugUnitTest/screens
          ls $d/*.png >/dev/null 2>&1 || exit 0
          tmp=$(mktemp -d); cp $d/*.png "$tmp"/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          wt=$(mktemp -d)
          if git fetch -q origin screens; then git worktree add -q "$wt" FETCH_HEAD; else git worktree add -q --detach "$wt"; (cd "$wt" && git checkout -q --orphan screens-new && git rm -rqf .); fi
          cd "$wt" && cp "$tmp"/*.png . && git add *.png && (git commit -qm "Screens from build ${{ github.run_number }} (${GITHUB_SHA::7})" || true) && git push -q origin HEAD:refs/heads/screens

      - name: Build release APK
        if: github.ref != 'refs/heads/ci-check'
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.key.outputs.keystore }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: avidviewer
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        if: github.ref != 'refs/heads/ci-check'
        run: cp app/build/outputs/apk/release/app-release.apk AvidViewer.apk

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/ci-check'
        with:
          name: AvidViewer-1.0.${{ github.run_number }}
          path: AvidViewer.apk

      - name: Publish release
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Avid Viewer 1.0.${{ github.run_number }}
          body: Install AvidViewer.apk on your TV box. New versions install over the old one and keep your settings.
          files: AvidViewer.apk
          make_latest: true
